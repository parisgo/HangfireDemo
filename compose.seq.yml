services:
  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?Set SEQ_ADMIN_PASSWORD before starting Seq}
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data

volumes:
  seq-data:
